{{- if not .Values.secobserve.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tso.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tso.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ required "secobserve.apiToken or secobserve.existingSecret is required" .Values.secobserve.apiToken | quote }}
{{- end }}
