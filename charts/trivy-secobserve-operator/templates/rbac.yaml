{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tso.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tso.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tso.fullname" . }}
  labels:
    {{- include "tso.labels" . | nindent 4 }}
rules:
  # read-only: the operator never writes to the cluster
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "sbomreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tso.fullname" . }}
  labels:
    {{- include "tso.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tso.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tso.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
