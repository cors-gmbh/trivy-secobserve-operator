[project]
name = "trivy-secobserve-operator"
version = "0.1.1"
description = "Kubernetes operator that forwards Trivy Operator reports (VulnerabilityReport + SbomReport) as CycloneDX to SecObserve and optionally stores them in GCS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kopf>=1.37",
    "kubernetes>=31.0",
    "requests>=2.32",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.18"]

[project.scripts]
trivy-secobserve = "trivy_secobserve.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trivy_secobserve"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
