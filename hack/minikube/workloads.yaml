# Deliberately outdated / vulnerable images as scan targets for the e2e test.
# No Services, no Ingress, no exposed ports: nothing here is reachable from outside the minikube node.
# ---------------------------------------------------------------------------------------------------------
# shop-prod: mapped via annotations to an existing SecObserve product group (rules + license policy apply)
apiVersion: v1
kind: Namespace
metadata:
  name: shop-prod
  labels:
    secobserve.io/enabled: "true"
  annotations:
    secobserve.io/product: "E2E Shop Prod"
    secobserve.io/product-group: "Pimcore Installationen"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop-prod
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:   # multi-container pod: nginx + php-fpm (PHP 8.1.28 < 8.1.29, before the CVE-2024-4577 fix)
        - name: nginx
          image: nginx:1.21.0
          resources: {requests: {cpu: 10m, memory: 16Mi}}
        - name: php
          image: php:8.1.28-fpm
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupal
  namespace: shop-prod
spec:
  replicas: 1
  selector: {matchLabels: {app: drupal}}
  template:
    metadata: {labels: {app: drupal}}
    spec:
      containers:   # PHP application with composer vendor dir (symfony, twig, guzzle, ...)
        - name: drupal
          image: drupal:9.1.0-apache
          resources: {requests: {cpu: 10m, memory: 32Mi}}
---
# Two CronJobs with the same image: must be uploaded only once (dedupe)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: import-a
  namespace: shop-prod
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: job
              image: php:8.1.28-cli
              command: ["php", "-v"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: import-b
  namespace: shop-prod
spec:
  schedule: "0 4 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: job
              image: php:8.1.28-cli
              command: ["php", "-v"]
---
# ---------------------------------------------------------------------------------------------------------
# node-app: no annotations -> default mapping (product = namespace name)
apiVersion: v1
kind: Namespace
metadata:
  name: node-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: node-app
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: node
          image: node:16.14.0-alpine
          command: ["sleep", "infinity"]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
