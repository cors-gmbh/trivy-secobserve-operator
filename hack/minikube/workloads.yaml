apiVersion: v1
kind: Namespace
metadata:
  name: opted-out
  labels:
    secobserve.io/enabled: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: opted-out
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:6.0.0
          resources: {requests: {cpu: 10m, memory: 16Mi}}
